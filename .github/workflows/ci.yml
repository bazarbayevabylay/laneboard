name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # v1 supports macOS and Linux only (ADR-0001 Q4).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:schema
      - run: npm run check:skill
      - run: npm test
      - run: npm run build
      # Web board e2e (ADR-0001 §31): Playwright's Chromium is downloaded on the CI runner only; one OS is enough for the browser.
      - if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:e2e
      - run: npm pack --dry-run
